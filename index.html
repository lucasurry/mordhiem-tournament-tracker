<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Hint: avoid stale document when switching deploys (GitHub Pages still caches ~10m on CDN) -->
  <meta http-equiv="Cache-Control" content="max-age=0, must-revalidate" />
  <title>Mordhiem Tournament</title>
  <link rel="stylesheet" href="style.css?v=a526090a9a0d62aed0484d7dffc79e3d6bb87104">
  <meta name="deploy-revision" content="a526090a9a0d62aed0484d7dffc79e3d6bb87104" />
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <h1>Mordhiem Tournament</h1>
    </div>
  </header>

  <nav class="tab-nav">
    <button class="tab-btn active" data-tab="tournament">Tournament</button>
    <button class="tab-btn" data-tab="admin">Admin</button>
  </nav>

  <div class="container">

    <!-- ── Tournament Tab ── -->
    <div id="tab-tournament" class="tab-pane active">

      <section class="card" id="section-upcoming">
        <h2 id="upcoming-title">Current Round</h2>
        <div id="upcoming-content"></div>
      </section>

      <section class="card">
        <h2>Scoreboard</h2>
        <div id="scoreboard-content"></div>
      </section>

      <section class="card">
        <h2>Match History</h2>
        <div id="history-content"></div>
      </section>

    </div>

    <!-- ── Admin Tab ── -->
    <div id="tab-admin" class="tab-pane">

      <section class="card">
        <h2>Players</h2>
        <div id="admin-players"></div>
        <div class="add-player-row">
          <input type="text" id="add-player-input" placeholder="New player name…" maxlength="30" autocomplete="off">
          <button id="add-player-btn" class="btn btn-primary">Add Player</button>
        </div>
        <p class="hint">Player changes take effect from the next round.</p>
      </section>

      <section class="card">
        <h2>Round Controls</h2>
        <div id="admin-round-controls"></div>
      </section>

      <section class="card card-danger">
        <h2>Danger Zone</h2>
        <p class="hint" style="margin-bottom:.75rem">This will erase all match data and clear the player list.</p>
        <button id="reset-btn" class="btn btn-danger">Reset Tournament</button>
      </section>

    </div>

  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script>

      messagingSenderId: "491402976532",

  <script src="app.js?v=a526090a9a0d62aed0484d7dffc79e3d6bb87104"></script>
</body>
</html>
