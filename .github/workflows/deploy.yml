name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Inject commit SHA as cache-bust version
        run: |
          VERSION="${{ github.sha }}"
          sed -i "s/style\.css?v=DEV/style.css?v=${VERSION}/g" index.html
          sed -i "s/app\.js?v=DEV/app.js?v=${VERSION}/g" index.html

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          exclude_assets: '.github'
